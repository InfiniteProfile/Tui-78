<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TUI 77</title>
<style>
  :root{
    --bg:#0a0a0c;
    --bg-elev:#131316;
    --card:#17171b;
    --border:#242429;
    --text:#e9e9ec;
    --text-dim:#8a8a93;
    --accent:#c9a24b;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header.site-head{
    position:sticky;
    top:0;
    z-index:20;
    padding:22px 20px 16px;
    text-align:center;
    background:linear-gradient(180deg, rgba(10,10,12,0.97), rgba(10,10,12,0.85) 70%, rgba(10,10,12,0));
    backdrop-filter:blur(6px);
  }
  header.site-head h1{
    font-size:clamp(20px,4vw,28px);
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text);
  }
  header.site-head h1 span{color:var(--accent);}
  header.site-head p{
    margin-top:6px;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.04em;
  }

  main{
    flex:1;
    width:100%;
    max-width:1400px;
    margin:0 auto;
    padding:10px 16px 40px;
  }

  .group{
    margin-top:28px;
  }
  .group-header{
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 4px 14px;
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:12px;
  }

  .card{
    position:relative;
    aspect-ratio:1/1;
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--border);
    cursor:pointer;
    transform:translateZ(0);
    transition:transform .2s ease, border-color .2s ease;
  }
  .card:active{transform:scale(0.97);}
  @media(hover:hover){
    .card:hover{border-color:#3a3a42;}
    .card:hover img{transform:scale(1.05);}
  }

  .card img, .card video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity .35s ease, transform .4s ease;
    background:var(--bg-elev);
  }
  .card img.loaded, .card video.loaded{opacity:1;}

  .card .ph{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card .ph::after{
    content:"";
    width:22px;height:22px;
    border-radius:50%;
    border:2px solid var(--border);
    border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .play-badge{
    position:absolute;
    right:8px;
    bottom:8px;
    width:26px;height:26px;
    border-radius:50%;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .play-badge svg{width:11px;height:11px;fill:#fff;margin-left:1px;}

  /* Pagination */
  nav.pager{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
    padding:34px 16px 20px;
  }
  nav.pager button{
    min-width:38px;
    height:38px;
    padding:0 10px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--bg-elev);
    color:var(--text-dim);
    font-size:13px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  nav.pager button:hover{border-color:#3a3a42;color:var(--text);}
  nav.pager button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#0a0a0c;
    font-weight:700;
  }
  nav.pager button:disabled{opacity:0.35;cursor:default;}

  footer.site-foot{
    text-align:center;
    padding:14px;
    font-size:11px;
    color:#55555c;
    letter-spacing:0.05em;
  }

  /* Lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(6,6,8,0.96);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    -webkit-tap-highlight-color:transparent;
  }
  .lightbox.open{display:flex;}
  .lightbox img, .lightbox video{
    max-width:100%;
    max-height:100%;
    border-radius:6px;
    object-fit:contain;
  }
  .lightbox .lb-close{
    position:absolute;
    top:18px;
    right:20px;
    width:40px;height:40px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:none;
    color:#fff;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lightbox .lb-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:46px;height:46px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:none;
    color:#fff;
    font-size:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lb-nav.prev{left:14px;}
  .lb-nav.next{right:14px;}
  @media(max-width:640px){
    .lb-nav{width:38px;height:38px;font-size:16px;}
  }
  .lightbox .lb-count{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.05em;
  }
</style>
</head>

    return dot > -1 ? file.substring(0, dot) : file;
  }

  var items = [];
  (function build(){
    var lastHeader = null;
    for(var i=0;i<FILES.length;i++){
      var f = FILES[i];
      var name = NAME_MAP[f.file] || NAME_MAP[prefixOf(f.file)] || null;
      var showHeader = false;
      if(name && name !== lastHeader){
        showHeader = true;
        lastHeader = name;
      } else if(!name){
        // an unnamed entry does not reset/repeat any header
      }
      items.push({
        file: f.file,
        video: f.video,
        url: BASE_URL + encodeURIComponent(f.file).replace(/%2F/g,"/"),
        groupLabel: name,
        showHeader: showHeader
      });
    }
  })();

  var TOTAL = items.length;
  var TOTAL_PAGES = Math.max(1, Math.ceil(TOTAL / PAGE_SIZE));

  document.getElementById("subCount").textContent =
    TOTAL.toLocaleString() + " profiles";

  // ---------------------------------------------------------------
  // Rendering — only the current page's DOM/images exist at any time.
  // Navigating pages tears down the previous page's media elements so
  // memory is freed before the next page is built.
  // ---------------------------------------------------------------
  var mainEl = document.getElementById("main");
  var pagerEl = document.getElementById("pager");
  var currentPage = 1;
  var io = null; // IntersectionObserver for lazy loading current page
  var pageFlatCards = []; // flat list of {file,url,video} for current page, for lightbox nav

  function teardownPage(){
    if(io){ io.disconnect(); io = null; }
    // Explicitly drop media sources before clearing, to release decoded
    // image/video memory immediately rather than waiting on GC.
    var media = mainEl.querySelectorAll("img,video");
    for(var i=0;i<media.length;i++){
      media[i].src = "";
      media[i].removeAttribute("src");
      if(media[i].pause) media[i].pause();
    }
    mainEl.innerHTML = "";
  }

  function renderPage(page){
    page = Math.min(Math.max(1, page), TOTAL_PAGES);
    teardownPage();
    currentPage = page;
    pageFlatCards = [];

    var start = (page-1) * PAGE_SIZE;
    var end = Math.min(start + PAGE_SIZE, TOTAL);
    var slice = items.slice(start, end);

    var frag = document.createDocumentFragment();
    var currentGroupEl = null;

    slice.forEach(function(item, idxInSlice){
      if(item.showHeader){
        var groupWrap = document.createElement("div");
        groupWrap.className = "group";
        var h = document.createElement("div");
        h.className = "group-header";
        h.textContent = item.groupLabel;
        groupWrap.appendChild(h);
        var grid = document.createElement("div");
        grid.className = "grid";
        groupWrap.appendChild(grid);
        frag.appendChild(groupWrap);
        currentGroupEl = grid;
      } else if(!currentGroupEl){
        var plainWrap = document.createElement("div");
        plainWrap.className = "group";
        var plainGrid = document.createElement("div");
        plainGrid.className = "grid";
        plainWrap.appendChild(plainGrid);
        frag.appendChild(plainWrap);
        currentGroupEl = plainGrid;
      }

      var card = document.createElement("div");
      card.className = "card";
      card.setAttribute("data-idx", String(pageFlatCards.length));

      var ph = document.createElement("div");
      ph.className = "ph";
      card.appendChild(ph);

      if(item.video){
        var v = document.createElement("video");
        v.muted = true;
        v.playsInline = true;
        v.preload = "none";
        v.setAttribute("data-src", item.url);
        card.appendChild(v);
        var badge = document.createElement("div");
        badge.className = "play-badge";
        badge.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5,3 21,12 5,21"></polygon></svg>';
        card.appendChild(badge);
      } else {
        var img = document.createElement("img");
        img.setAttribute("data-src", item.url);
        img.alt = "";
        img.loading = "lazy";
        card.appendChild(img);
      }

      card.addEventListener("click", (function(flatIdx){
        return function(){ openLightbox(flatIdx); };
      })(pageFlatCards.length));

      pageFlatCards.push(item);
      currentGroupEl.appendChild(card);
    });

    mainEl.appendChild(frag);
    attachLazyLoad();
    renderPager();
    window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
  }

  function attachLazyLoad(){
    var targets = mainEl.querySelectorAll("img[data-src], video[data-src]");
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          var el = entry.target;
          var src = el.getAttribute("data-src");
          if(src){
            el.src = src;
            el.removeAttribute("data-src");
            el.addEventListener(el.tagName === "VIDEO" ? "loadeddata" : "load", function(){
              el.classList.add("loaded");
              var ph = el.parentElement.querySelector(".ph");
              if(ph) ph.remove();
            }, {once:true});
          }
          io.unobserve(el);
        }
      });
    }, {root:null, rootMargin:"200px 0px", threshold:0.01});
    targets.forEach(function(t){ io.observe(t); });
  }

  // ---------------------------------------------------------------
  // Pagination nav — direct access to any page
  // ---------------------------------------------------------------
  function renderPager(){
    pagerEl.innerHTML = "";

    var prev = document.createElement("button");
    prev.textContent = "‹";
    prev.disabled = currentPage === 1;
    prev.addEventListener("click", function(){ renderPage(currentPage-1); });
    pagerEl.appendChild(prev);

    for(var p=1; p<=TOTAL_PAGES; p++){
      var btn = document.createElement("button");
      btn.textContent = String(p);
      if(p === currentPage) btn.className = "active";
      (function(pg){
        btn.addEventListener("click", function(){ renderPage(pg); });
      })(p);
      pagerEl.appendChild(btn);
    }

    var next = document.createElement("button");
    next.textContent = "›";
    next.disabled = currentPage === TOTAL_PAGES;
    next.addEventListener("click", function(){ renderPage(currentPage+1); });
    pagerEl.appendChild(next);
  }

  // ---------------------------------------------------------------
  // Lightbox
  // ---------------------------------------------------------------
  var lb = document.getElementById("lightbox");
  var lbStage = document.getElementById("lbStage");
  var lbCount = document.getElementById("lbCount");
  var lbIdx = 0;

  function openLightbox(flatIdx){
    lbIdx = flatIdx;
    renderLightbox();
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function renderLightbox(){
    var item = pageFlatCards[lbIdx];
    lbStage.innerHTML = "";
    if(!item) return;
    if(item.video){
      var v = document.createElement("video");
      v.src = item.url;
      v.controls = true;
      v.autoplay = true;
      v.playsInline = true;
      lbStage.appendChild(v);
    } else {
      var img = document.createElement("img");
      img.src = item.url;
      img.alt = "";
      lbStage.appendChild(img);
    }
    lbCount.textContent = (lbIdx+1) + " / " + pageFlatCards.length +
      "  ·  page " + currentPage + " of " + TOTAL_PAGES;
  }

  function closeLightbox(){
    lb.classList.remove("open");
    lbStage.innerHTML = "";
    document.body.style.overflow = "";
  }

  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  lb.addEventListener("click", function(e){ if(e.target === lb) closeLightbox(); });

  document.getElementById("lbPrev").addEventListener("click", function(e){
    e.stopPropagation();
    if(lbIdx > 0){ lbIdx--; renderLightbox(); }
    else if(currentPage > 1){ renderPage(currentPage-1); lbIdx = pageFlatCards.length-1; renderLightbox(); }
  });
  document.getElementById("lbNext").addEventListener("click", function(e){
    e.stopPropagation();
    if(lbIdx < pageFlatCards.length-1){ lbIdx++; renderLightbox(); }
    else if(currentPage < TOTAL_PAGES){ renderPage(currentPage+1); lbIdx = 0; renderLightbox(); }
  });

  document.addEventListener("keydown", function(e){
    if(!lb.classList.contains("open")) return;
    if(e.key === "Escape") closeLightbox();
    if(e.key === "ArrowLeft") document.getElementById("lbPrev").click();
    if(e.key === "ArrowRight") document.getElementById("lbNext").click();
  });

  // simple touch swipe support
  (function(){
    var touchStartX = null;
    lb.addEventListener("touchstart", function(e){ touchStartX = e.changedTouches[0].clientX; }, {passive:true});
    lb.addEventListener("touchend", function(e){
      if(touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      if(Math.abs(dx) > 50){
        if(dx < 0) document.getElementById("lbNext").click();
        else document.getElementById("lbPrev").click();
      }
      touchStartX = null;
    }, {passive:true});
  })();

  // ---------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------
  renderPage(1);

})();
</script>
</body>
</html>
